name: Estado versao App Store

"on":
  workflow_dispatch:

jobs:
  estado:
    runs-on: macos-15
    steps:
      - name: Consultar estado completo da versao
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          ruby -e '
          require "jwt"
          require "json"
          require "net/http"
          require "uri"

          def req(token, method, url, body = nil)
            uri = URI(url)
            klass = { "GET" => Net::HTTP::Get, "PATCH" => Net::HTTP::Patch, "POST" => Net::HTTP::Post }[method]
            r = klass.new(uri)
            r["Authorization"] = "Bearer #{token}"
            r["Content-Type"] = "application/json"
            r.body = body.to_json if body
            res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(r) }
            puts "#{method} #{url} -> #{res.code}"
            JSON.parse(res.body || "{}")
          end

          key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
          now = Time.now.to_i
          token = JWT.encode({ iss: ENV["APPSTORE_ISSUER_ID"], iat: now, exp: now + 1200, aud: "appstoreconnect-v1" }, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })

          base = "https://api.appstoreconnect.apple.com/v1"
          apps = req(token, "GET", "#{base}/apps?filter[bundleId]=com.agendalogo.app")
          app_id = apps.dig("data", 0, "id")
          puts "APP: #{app_id}"

          vers = req(token, "GET", "#{base}/apps/#{app_id}/appStoreVersions?limit=10")
          v10 = nil
          vers["data"].each do |v|
            puts "VERSAO #{v["attributes"]["versionString"]} id=#{v["id"]} estado=#{v["attributes"]["appStoreState"]}"
            v10 = v if v["attributes"]["versionString"] == "1.0"
          end
          exit 1 unless v10
          vid = v10["id"]

          brel = v10.dig("relationships", "build", "data")
          puts "BUILD SELECIONADO ATUAL: #{brel ? brel["id"] : "nenhum"}"

          locs = req(token, "GET", "#{base}/appStoreVersions/#{vid}/appStoreVersionLocalizations")
          loc_id = nil
          locs["data"].each do |l|
            a = l["attributes"]
            puts "LOC #{a["locale"]} id=#{l["id"]}"
            puts "  descricao: #{(a["description"] || "VAZIA")[0,60]}"
            puts "  nota_revisao: #{a["appReviewNote"] ? a["appReviewNote"][0,60] : "VAZIA"}"
            loc_id ||= l["id"]
          end

          if loc_id
            sets = req(token, "GET", "#{base}/appStoreVersionLocalizations/#{loc_id}/appScreenshotSets?include=appScreenshots&limit=30")
            if sets["data"].empty?
              puts "SCREENSHOTS: NENHUM SET (capturas nao enviadas)"
            end
            sets["data"].each do |s|
              count = (sets["included"] || []).count { |i| i["type"] == "appScreenshots" && i.dig("relationships", "appScreenshotSet", "data", "id") == s["id"] }
              puts "SCREENSHOT SET #{s["attributes"]["screenshotDisplayType"]}: #{count} imagem(ns)"
            end
          end

          builds = req(token, "GET", "#{base}/builds?filter[app]=#{app_id}&limit=5&sort=-version")
          builds["data"].each do |b|
            puts "BUILD DISPONIVEL v#{b["attributes"]["version"]} id=#{b["id"]} estado=#{b["attributes"]["processingState"]}"
          end
          '
