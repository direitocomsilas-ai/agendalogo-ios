name: Consultar rejeicao App Store

"on":
  workflow_dispatch:

jobs:
  consulta:
    runs-on: macos-15
    steps:
      - name: Consultar versoes e problemas da revisao
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          ruby -e '
          require "jwt"
          require "json"
          require "net/http"
          require "uri"

          def get(token, url)
            uri = URI(url)
            req = Net::HTTP::Get.new(uri)
            req["Authorization"] = "Bearer #{token}"
            res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
            puts "HTTP #{res.code} #{url}"
            JSON.parse(res.body)
          end

          key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
          now = Time.now.to_i
          token = JWT.encode({ iss: ENV["APPSTORE_ISSUER_ID"], iat: now, exp: now + 1200, aud: "appstoreconnect-v1" }, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })

          base = "https://api.appstoreconnect.apple.com/v1"
          apps = get(token, "#{base}/apps?filter[bundleId]=com.agendalogo.app")
          app_id = apps.dig("data", 0, "id")
          puts "APP_ID: #{app_id}"

          vers = get(token, "#{base}/apps/#{app_id}/appStoreVersions?limit=10&sort=-versionString")
          (vers["data"] || []).each do |v|
            a = v["attributes"]
            puts "VERSAO #{a["versionString"]} | estado: #{a["appStoreState"]}"
            issues = get(token, "#{base}/appStoreVersions/#{v["id"]}/submissionIssues?include=submissionIssueThreads")
            (issues["data"] || []).each do |i|
              at = i["attributes"] || {}
              puts "  ISSUE: #{at["title"]}"
              puts "  CORPO: #{at["body"]}"
              puts "  ATIVO: #{at["isActive"]}"
            end
            (issues["included"] || []).each do |inc|
              at = inc["attributes"] || {}
              puts "  THREAD[#{inc["type"]}] #{at["subject"]}"
              puts "  MSG: #{at["body"]}"
            end
          end

          builds = get(token, "#{base}/builds?filter[app]=#{app_id}&limit=5&sort=-version")
          (builds["data"] || []).each do |b|
            a = b["attributes"]
            puts "BUILD v#{a["version"]} | processing: #{a["processingState"]}"
          end
          '
