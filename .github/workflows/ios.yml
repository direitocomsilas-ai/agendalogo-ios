name: "iOS - Build e TestFlight"

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Criar arquivos, compilar e enviar ao TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
      CI: "true"
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Selecionar Xcode moderno (16.3+ le o formato novo)
        run: |
          xcodebuild -version || true
          ls /Applications | grep -i xcode || true
          for v in 26.3 26.2 26.1 26.0 16.4 16.3; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              echo "Xcode selecionado: ${v}"
              break
            fi
          done
          xcodebuild -version

      - name: Criar a estrutura completa do app
        run: |
          mkdir -p app/AgendaLogo/Assets.xcassets/AppIcon.appiconset app/fastlane
          cat > app/project.yml <<'FIMPROJ'
          name: AgendaLogo
          options:
            bundleIdPrefix: com.agendalogo
            createIntermediateGroups: true
          settings:
            base:
              MARKETING_VERSION: "1.1.0"
              CURRENT_PROJECT_VERSION: "${{ github.run_number }}"
              SWIFT_VERSION: "5.9"
              CODE_SIGN_STYLE: Manual
              DEVELOPMENT_LANGUAGE: pt-BR
          targets:
            AgendaLogo:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: AgendaLogo
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.agendalogo.app
                  TARGETED_DEVICE_FAMILY: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
              entitlements:
                path: AgendaLogo/AgendaLogo.entitlements
                properties:
                  com.apple.developer.applesignin:
                    - Default
              info:
                path: AgendaLogo/Info.plist
                properties:
                  CFBundleDisplayName: Agenda Logo
                  CFBundleShortVersionString: "$(MARKETING_VERSION)"
                  CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
                  UILaunchScreen:
                    UIColorName: ""
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  ITSAppUsesNonExemptEncryption: false
                  NSCameraUsageDescription: Usamos a câmera para você tirar fotos de perfil, serviços e produtos.
                  NSPhotoLibraryUsageDescription: Usamos o acesso às suas fotos para você escolher imagens de perfil, serviços e produtos.
                  NSPhotoLibraryAddUsageDescription: Permite salvar imagens na sua galeria de fotos.
                  NSMicrophoneUsageDescription: Usamos o microfone para gravação de áudio.
          schemes:
            AgendaLogo:
              build:
                targets:
                  AgendaLogo: all
              run:
                config: Debug
              archive:
                config: Release
          FIMPROJ
          cat > app/AgendaLogo/AgendaLogoApp.swift <<'FIMSW1'
          import SwiftUI

          @main
          struct AgendaLogoApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.light)
                  }
              }
          }
          FIMSW1
          cat > app/AgendaLogo/ContentView.swift <<'FIMSW2'
          import SwiftUI
          import WebKit

          struct ContentView: View {
              @StateObject private var model = WebViewModel()

              var body: some View {
                  ZStack {
                      Color.white.ignoresSafeArea()
                      WebView(model: model)
                          .ignoresSafeArea(.container, edges: .bottom)

                      if model.isOffline {
                          offlineView
                              .background(Color.white.ignoresSafeArea())
                      }
                  }
              }

              private var offlineView: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "wifi.slash")
                          .font(.system(size: 56, weight: .light))
                          .foregroundColor(Color(red: 0.02, green: 0.59, blue: 0.41))
                      Text("Sem conexão")
                          .font(.title2.bold())
                      Text("Verifique sua internet para usar o Agenda Logo.\nSua agenda e seus clientes voltam a aparecer quando a conexão voltar.")
                          .font(.subheadline)
                          .foregroundColor(.gray)
                          .multilineTextAlignment(.center)
                          .padding(.horizontal, 32)
                      Button {
                          model.retry()
                      } label: {
                          Text("Tentar novamente")
                              .font(.headline)
                              .foregroundColor(.white)
                              .padding(.horizontal, 32)
                              .padding(.vertical, 14)
                              .background(Color(red: 0.02, green: 0.59, blue: 0.41))
                              .cornerRadius(16)
                      }
                  }
              }
          }
          FIMSW2
          cat > app/AgendaLogo/WebView.swift <<'FIMSW3'
          import SwiftUI
          import WebKit
          import AuthenticationServices

          final class WebViewModel: ObservableObject {
              @Published var isLoading = false
              @Published var isOffline = false
              weak var webView: WKWebView?
              let startURL = URL(string: "https://agendalogo.com/entrar")!

              func retry() {
                  isOffline = false
                  webView?.reload()
              }
          }

          struct WebView: UIViewRepresentable {
              @ObservedObject var model: WebViewModel

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  let viewportScript = WKUserScript(source: "var meta=document.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no';document.head.appendChild(meta);", injectionTime: .atDocumentEnd, forMainFrameOnly: true)
                  config.userContentController.addUserScript(viewportScript)
                  // Ponte JS -> nativo para o Sign in with Apple do sistema (iCloud)
                  config.userContentController.add(context.coordinator, name: "appleSignIn")
                  let web = WKWebView(frame: .zero, configuration: config)
                  let defaultUA = web.value(forKey: "userAgent") as? String ?? "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148"
                  web.customUserAgent = defaultUA + " AgendaLogoApp/1"
                  web.navigationDelegate = context.coordinator
                  web.allowsBackForwardNavigationGestures = true
                  web.scrollView.contentInsetAdjustmentBehavior = .never
                  web.scrollView.minimumZoomScale = 1.0
                  web.scrollView.maximumZoomScale = 1.0
                  web.scrollView.isScrollEnabled = true
                  model.webView = web
                  web.load(URLRequest(url: model.startURL))
                  return web
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}

              func makeCoordinator() -> Coordinator {
                  Coordinator(model)
              }

              final class Coordinator: NSObject, WKNavigationDelegate, WKScriptMessageHandler {
                  private let model: WebViewModel
                  private var authController: ASAuthorizationController?

                  init(_ model: WebViewModel) {
                      self.model = model
                  }

                  // MARK: - Ponte do Sign in with Apple

                  func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                      guard message.name == "appleSignIn" else { return }
                      DispatchQueue.main.async {
                          let request = ASAuthorizationAppleIDProvider().createRequest()
                          request.requestedScopes = [.fullName, .email]
                          let controller = ASAuthorizationController(authorizationRequests: [request])
                          self.authController = controller
                          controller.delegate = self
                          controller.presentationContextProvider = self
                          controller.performRequests()
                      }
                  }

                  private func reply(idToken: String = "", firstName: String = "", familyName: String = "", error: String = "") {
                      let obj: [String: Any] = ["idToken": idToken, "firstName": firstName, "familyName": familyName, "error": error]
                      guard let data = try? JSONSerialization.data(withJSONObject: obj),
                            let json = String(data: data, encoding: .utf8) else { return }
                      self.model.webView?.evaluateJavaScript(
                          "window.__appleNativeSignInResult && window.__appleNativeSignInResult(\(json))",
                          completionHandler: nil
                      )
                  }

                  func webView(_ webView: WKWebView, didStartProvisionalNavigation navigation: WKNavigation!) {
                      DispatchQueue.main.async { self.model.isLoading = true }
                  }

                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                      DispatchQueue.main.async {
                          self.model.isLoading = false
                          self.model.isOffline = false
                          webView.scrollView.zoomScale = 1.0
                          webView.scrollView.contentInset = .zero
                      }
                  }

                  func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) {
                      DispatchQueue.main.async {
                          self.model.isLoading = false
                          self.model.isOffline = true
                      }
                  }

                  func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction,
                               decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                      guard let url = navigationAction.request.url else {
                          decisionHandler(.allow)
                          return
                      }
                      let scheme = url.scheme?.lowercased() ?? ""

                      // Ligações, e-mails, WhatsApp e SMS abrem no app correspondente do iPhone
                      if ["tel", "mailto", "whatsapp", "sms", "itms-apps"].contains(scheme) {
                          UIApplication.shared.open(url)
                          decisionHandler(.cancel)
                          return
                      }

                      // Login com Google não funciona dentro do WebView (Google bloqueia):
                      // abre no Safari do próprio iPhone
                      let host = url.host?.lowercased() ?? ""
                      if host.contains("accounts.google.com") || host.contains("appleid.apple.com") {
                          UIApplication.shared.open(url)
                          decisionHandler(.cancel)
                          return
                      }

                      decisionHandler(.allow)
                  }

                  // Links com target="_blank" (janela nova) abrem na mesma tela
                  func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration,
                               for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                      webView.load(navigationAction.request)
                      return nil
                  }
              }
          }

          // MARK: - Resultado do Sign in with Apple

          extension WebView.Coordinator: ASAuthorizationControllerDelegate, ASAuthorizationControllerPresentationContextProviding {

              func presentationAnchor(for controller: ASAuthorizationController) -> ASPresentationAnchor {
                  self.model.webView?.window ?? ASPresentationAnchor()
              }

              func authorizationController(controller: ASAuthorizationController, didCompleteWithAuthorization authorization: ASAuthorization) {
                  guard let cred = authorization.credential as? ASAuthorizationAppleIDCredential,
                        let tokenData = cred.identityToken,
                        let idToken = String(data: tokenData, encoding: .utf8) else {
                      self.reply(error: "Credenciais da Apple não recebidas.")
                      return
                  }
                  self.reply(idToken: idToken, firstName: cred.fullName?.givenName ?? "", familyName: cred.fullName?.familyName ?? "")
              }

              func authorizationController(controller: ASAuthorizationController, didCompleteWithError error: Error) {
                  if let authError = error as? ASAuthorizationError, authError.code == .canceled {
                      self.reply(error: "Login com a Apple cancelado.")
                  } else {
                      self.reply(error: error.localizedDescription)
                  }
              }
          }
          FIMSW3
          cat > app/AgendaLogo/Assets.xcassets/Contents.json <<'FIMJS1'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          FIMJS1
          cat > app/AgendaLogo/Assets.xcassets/AppIcon.appiconset/Contents.json <<'FIMJS2'
          {
            "images" : [
              {
                "filename" : "icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          FIMJS2
          cat > app/fastlane/Fastfile <<'FIMFAST'
          default_platform(:ios)

          BUNDLE_ID = "com.agendalogo.app"

          def connect_api_key
            app_store_connect_api_key(
              key_id: ENV["APPSTORE_KEY_ID"],
              issuer_id: ENV["APPSTORE_ISSUER_ID"],
              key_content: ENV["APPSTORE_P8"],
              is_key_content_base64: false,
              duration: 1200
            )
          end

          platform :ios do
            desc "Compila o app e envia para o TestFlight"
            lane :release do
              api_key = connect_api_key

              match(
                type: "appstore",
                readonly: false,
                force: true,
                app_identifier: BUNDLE_ID,
                team_id: ENV["APPLE_TEAM_ID"],
                git_url: ENV["MATCH_GIT_URL"],
                git_branch: "signing",
                shallow_clone: false,
                keychain_name: "build.keychain",
                keychain_password: ENV["MATCH_PASSWORD"]
              )

              pw = ENV["MATCH_PASSWORD"].to_s
              `security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "#{pw}" build.keychain 2>/dev/null || true`
              UI.important("Keychain dedicado build.keychain preparado")

              build_app(
                project: "AgendaLogo.xcodeproj",
                scheme: "AgendaLogo",
                export_method: "app-store",
                xcargs: "DEVELOPMENT_TEAM=#{ENV['APPLE_TEAM_ID']} CODE_SIGN_STYLE=Manual \"PROVISIONING_PROFILE_SPECIFIER=match AppStore #{BUNDLE_ID}\" \"CODE_SIGN_IDENTITY=Apple Distribution\"",
                export_options: {
                  provisioningProfiles: {
                    BUNDLE_ID => "match AppStore #{BUNDLE_ID}"
                  }
                }
              )

              upload_to_testflight(
                api_key: api_key,
                ipa: lane_context[SharedValues::IPA_OUTPUT_PATH],
                skip_waiting_for_build_processing: true
              )

              UI.success("Build enviado para o TestFlight com sucesso!")
            end
          end
          FIMFAST
          curl -fsSL "https://agendalogo.com/icons/agendalogo-1024.png" -o app/AgendaLogo/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          sips -g pixelWidth -g pixelHeight app/AgendaLogo/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          echo "Estrutura criada:"
          find app -type f | sort

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Registrar bundle e criar app na App Store Connect
        run: |
          set -e
          TOKEN=$(ruby -rjwt -ropenssl -e '
            key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
            now = Time.now.to_i
            payload = { iss: ENV["APPSTORE_ISSUER_ID"], exp: now + 1200, aud: "appstoreconnect-v1" }
            puts JWT.encode(payload, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })
          ')
          echo "Token gerado (${#TOKEN} caracteres)."
          REG=$(curl -s -X POST "https://api.appstoreconnect.apple.com/v1/bundleIds" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"data":{"type":"bundleIds","attributes":{"identifier":"com.agendalogo.app","name":"Agenda Logo","platform":"IOS"}}}')
          echo "$REG" | head -c 400; echo
          if echo "$REG" | grep -q '"errors"'; then
            if echo "$REG" | grep -q 'ENTITY_ALREADY_EXISTS\|409'; then
              echo "Bundle ID ja registrado. Seguindo."
            else
              echo "::warning::Registro do bundle retornou erro (veja acima)."
            fi
          fi
          APP=$(curl -s -X POST "https://api.appstoreconnect.apple.com/v1/apps" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"data":{"type":"apps","attributes":{"bundleId":"com.agendalogo.app","name":"Agenda Logo","sku":"AGENDALOGO1","primaryLocale":"pt-BR"}}}')
          echo "$APP" | head -c 400; echo
          if echo "$APP" | grep -q '"errors"'; then
            if echo "$APP" | grep -q 'ENTITY_ALREADY_EXISTS\|409'; then
              echo "App ja existe na App Store Connect. Seguindo."
            else
              echo "::warning::Criacao do app retornou erro (veja acima)."
            fi
          fi
          echo "Verificando se o app ja consta na App Store Connect..."
          CHECK=$(curl -s "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.agendalogo.app" -H "Authorization: Bearer $TOKEN")
          echo "$CHECK" | head -c 400; echo

      - name: Habilitar Sign in with Apple no App ID
        run: |
          set -e
          TOKEN=$(ruby -rjwt -ropenssl -e '
            key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
            now = Time.now.to_i
            payload = { iss: ENV["APPSTORE_ISSUER_ID"], exp: now + 1200, aud: "appstoreconnect-v1" }
            puts JWT.encode(payload, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })
          ')
          BID=$(curl -s "https://api.appstoreconnect.apple.com/v1/bundleIds?filter%5Bidentifier%5D=com.agendalogo.app" -H "Authorization: Bearer $TOKEN" | ruby -rjson -e 'd=JSON.parse(STDIN.read); puts d.dig("data",0,"id")' 2>/dev/null || true)
          echo "Bundle interno: ${BID:-nao encontrado}"
          if [ -n "$BID" ]; then
            if curl -s "https://api.appstoreconnect.apple.com/v1/bundleIds/$BID/capabilities" -H "Authorization: Bearer $TOKEN" | grep -q APPLE_ID_AUTH; then
              echo "Sign in with Apple ja habilitado."
            else
              echo "Habilitando Sign in with Apple..."
              curl -s -X POST "https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -d "{\"data\":{\"type\":\"bundleIdCapabilities\",\"attributes\":{\"capabilityType\":\"APPLE_ID_AUTH\",\"settings\":[{\"key\":\"APPLE_ID_AUTH_APP_CONSENT\",\"options\":[{\"key\":\"PRIMARY_APP_CONSENT\"}]}]},\"relationships\":{\"bundleId\":{\"data\":{\"type\":\"bundleIds\",\"id\":\"$BID\"}}}}}" | head -c 400; echo
            fi
          fi

      - name: Remover perfil antigo (forca recriacao com Sign in with Apple)
        run: |
          set -e
          TOKEN=$(ruby -rjwt -ropenssl -e '
            key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
            now = Time.now.to_i
            payload = { iss: ENV["APPSTORE_ISSUER_ID"], exp: now + 1200, aud: "appstoreconnect-v1" }
            puts JWT.encode(payload, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })
          ')
          echo "Procurando perfis antigos do app..."
          for PID in $(curl -s "https://api.appstoreconnect.apple.com/v1/profiles?limit=50" -H "Authorization: Bearer $TOKEN" | ruby -rjson -e 'd=JSON.parse(STDIN.read); (d["data"]||[]).each{|p| puts p["id"] if p.dig("attributes","name").to_s.include?("agendalogo")}'); do
            echo "Deletando perfil antigo $PID..."
            curl -s -X DELETE "https://api.appstoreconnect.apple.com/v1/profiles/$PID" -H "Authorization: Bearer $TOKEN" -o /dev/null -w "delete:%{http_code}\n"
          done
          echo "Perfis antigos removidos (se existiam)."

      - name: Gerar projeto Xcode
        run: xcodegen generate
        working-directory: app

      - name: Criar branch de assinatura (primeira execucao)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git switch -C signing
          git commit --allow-empty -m "Armazenamento de assinaturas"
          git push origin signing || true

      - name: Criar chaveiro dedicado (evita travar no codesign)
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          security create-keychain -p "$MATCH_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MATCH_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security list-keychains

      - name: Compilar e enviar ao TestFlight
        run: fastlane release
        working-directory: app

      - name: Salvar o app (.ipa) como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AgendaLogo-ipa
          path: app/*.ipa
          if-no-files-found: ignore
