name: Debug ASC API
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Ver respostas da API
        run: |
          set -e
          APP=6811427570
          gen_token() {
            ruby -rjwt -ropenssl -e '
              key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
              now = Time.now.to_i
              payload = { iss: ENV["APPSTORE_ISSUER_ID"], exp: now + 1100, aud: "appstoreconnect-v1" }
              puts JWT.encode(payload, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })
            '
          }
          api() {
            T=$(gen_token)
            curl -s -w "\nHTTP_STATUS:%{http_code}\n" -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$@"
          }

          echo "===== A. builds simples ====="
          api "https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=$APP&limit=5" | head -c 2500
          echo ""
          echo "===== B. builds com preReleaseVersion ====="
          api "https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=$APP&include=preReleaseVersion&limit=5" > /tmp/b.json
          ruby -rjson -e '
            d=JSON.parse(File.read("/tmp/b.json"))
            puts "data size: " + (d["data"]||[]).size.to_s
            (d["data"]||[]).first(5).each{|b| puts "BUILD " + b["id"] + " | versao(build num): " + b.dig("attributes","version").to_s + " | processado: " + b.dig("attributes","processed").to_s + " | estado: " + b.dig("attributes","processingState").to_s + " | preId: " + b.dig("relationships","preReleaseVersion","data","id").to_s }
            puts "included size: " + (d["included"]||[]).size.to_s
            (d["included"]||[]).each{|p| puts "INCL " + p["type"] + " " + p["id"] + " | versionString: " + p.dig("attributes","versionString").to_s }
            if d["errors"]; puts "ERROS: " + d["errors"].map{|e| e["status"].to_s + " " + e["code"].to_s + " " + e["title"].to_s}.join(" ; ") ; end'
          echo ""
          echo "===== C. versoes ====="
          api "https://api.appstoreconnect.apple.com/v1/apps/$APP/appStoreVersions?filter%5Bplatform%5D=IOS&limit=20" > /tmp/v.json
          ruby -rjson -e '
            d=JSON.parse(File.read("/tmp/v.json"))
            (d["data"]||[]).each{|v| puts "VERSAO " + v["id"] + " | " + v.dig("attributes","versionString").to_s + " | estado: " + v.dig("attributes","appStoreState").to_s + " | build: " + v.dig("relationships","build","data","id").to_s }'
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}