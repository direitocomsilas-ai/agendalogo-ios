name: Debug ASC API
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Ver erros completos da versao 1.1
        run: |
          set -e
          APP=6811427570
          NEWID=912785e7-b572-4cb1-afa3-94f6ed28d5b2
          gen_token() {
            ruby -rjwt -ropenssl -e '
              key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
              now = Time.now.to_i
              payload = { iss: ENV["APPSTORE_ISSUER_ID"], exp: now + 1100, aud: "appstoreconnect-v1" }
              puts JWT.encode(payload, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })
            '
          }
          api() {
            T=$(gen_token)
            curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$@"
          }

          echo "===== A. reviewSubmissionItems: erro completo ====="
          api -X POST "https://api.appstoreconnect.apple.com/v1/reviewSubmissionItems" \
            -d "{\"data\":{\"type\":\"reviewSubmissionItems\",\"relationships\":{\"reviewSubmission\":{\"data\":{\"type\":\"reviewSubmissions\",\"id\":\"5edad32a-3884-4fe4-895e-d306d1514070\"}},\"appStoreVersion\":{\"data\":{\"type\":\"appStoreVersions\",\"id\":\"$NEWID\"}}}}}"
          echo ""
          echo "===== B. localizacao da versao 1.1 ====="
          api "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$NEWID/appStoreVersionLocalizations?limit=5"
          echo ""
          echo "===== C. app info (nome, locale) ====="
          api "https://api.appstoreconnect.apple.com/v1/apps/$APP?include=appStoreVersions"
          echo ""
          echo "===== D. itens da reviewSubmission ====="
          api "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/5edad32a-3884-4fe4-895e-d306d1514070/items?limit=10"
          echo ""
          echo "===== E. reviewSubmissions do app ====="
          api "https://api.appstoreconnect.apple.com/v1/reviewSubmissions?filter%5Bapp%5D=$APP&limit=5"
          echo ""
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}