name: Diagnostico Sign in with Apple
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: macos-latest
    steps:
      - name: Verdade absoluta
        run: |
          set -e
          TOKEN=$(ruby -rjwt -ropenssl -e '
            key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
            now = Time.now.to_i
            payload = { iss: ENV["APPSTORE_ISSUER_ID"], exp: now + 1200, aud: "appstoreconnect-v1" }
            puts JWT.encode(payload, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })
          ')
          BID=86KCS2L573
          echo "=== A. bundleIdCapabilities por filtro (raw) ==="
          curl -s "https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities?filter%5BbundleId%5D=$BID" -H "Authorization: Bearer $TOKEN"; echo ""
          echo "=== B. capability direto (self link, raw) ==="
          curl -s "https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities/$BID`_APPLE_ID_AUTH" -H "Authorization: Bearer $TOKEN"; echo ""
          echo "=== C. perfil atual do match: baixar e decodificar ==="
          PID2=$(curl -s "https://api.appstoreconnect.apple.com/v1/profiles?limit=50" -H "Authorization: Bearer $TOKEN" | ruby -rjson -e 'd=JSON.parse(STDIN.read); p=(d["data"]||[]).find{|x| x.dig("attributes","name").to_s.include?("agendalogo")}; puts p ? p["id"] : ""')
          echo "perfil: $PID2"
          echo "--- profileContent headers ---"
          curl -s -D - -o /tmp/profile.mobileprovision "https://api.appstoreconnect.apple.com/v1/profiles/$PID2/profileContent" -H "Authorization: Bearer $TOKEN" | head -15
          echo "--- primeiros bytes do arquivo ---"
          head -c 300 /tmp/profile.mobileprovision | strings | head -10
          echo "--- decodificar CMS ---"
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist || echo "cms falhou"
          echo "--- Entitlements do perfil ---"
          plutil -extract Entitlements xml1 -o - /tmp/profile.plist
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}