name: Publicar versao 1.1 no App Store Connect
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Criar versao, anexar build e submeter
        run: |
          set -e
          TOKEN=$(ruby -rjwt -ropenssl -e '
            key = OpenSSL::PKey::EC.new(ENV["APPSTORE_P8"])
            now = Time.now.to_i
            payload = { iss: ENV["APPSTORE_ISSUER_ID"], exp: now + 3600, aud: "appstoreconnect-v1" }
            puts JWT.encode(payload, key, "ES256", { kid: ENV["APPSTORE_KEY_ID"], typ: "JWT" })
          ')
          APP=6811427570

          api() { curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }

          echo "=== 1. Versoes existentes ==="
          api "https://api.appstoreconnect.apple.com/v1/apps/$APP/appStoreVersions?filter%5Bplatform%5D=IOS&limit=20" > /tmp/versoes.json
          ruby -rjson -e 'd=JSON.parse(File.read("/tmp/versoes.json")); (d["data"]||[]).each{|v| puts v["id"].to_s + " | v" + v.dig("attributes","versionString").to_s + " | " + v.dig("attributes","appStoreState").to_s}'

          NEWID=$(ruby -rjson -e 'd=JSON.parse(File.read("/tmp/versoes.json")); v=(d["data"]||[]).find{|x| x.dig("attributes","versionString")=="1.1"}; puts v ? v["id"] : ""')
          OLDID=$(ruby -rjson -e 'd=JSON.parse(File.read("/tmp/versoes.json")); v=(d["data"]||[]).find{|x| x.dig("attributes","versionString")=="1.0"}; puts v ? v["id"] : ""')
          echo "versao 1.1: ${NEWID:-nao existe} | versao 1.0: ${OLDID:-nao existe}"

          if [ -z "$NEWID" ]; then
            echo "=== 2. Criando versao 1.1 ==="
            RELTYPE=$(ruby -rjson -e 'd=JSON.parse(File.read("/tmp/versoes.json")); v=(d["data"]||[]).find{|x| x.dig("attributes","versionString")=="1.0"}; puts (v && v.dig("attributes","releaseType")) ? v["attributes"]["releaseType"] : "AFTER_APPROVAL"')
            echo "releaseType: $RELTYPE"
            api -X POST "https://api.appstoreconnect.apple.com/v1/appStoreVersions" \
              -d "{\"data\":{\"type\":\"appStoreVersions\",\"attributes\":{\"platform\":\"IOS\",\"versionString\":\"1.1\",\"releaseType\":\"$RELTYPE\"},\"relationships\":{\"app\":{\"data\":{\"type\":\"apps\",\"id\":\"$APP\"}}}}}" > /tmp/nova.json
            head -c 400 /tmp/nova.json; echo ""
            NEWID=$(ruby -rjson -e 'd=JSON.parse(File.read("/tmp/nova.json")); puts d.dig("data","id") || ""')
            if [ -z "$NEWID" ]; then
              echo "tentando endpoint alternativo..."
              api -X POST "https://api.appstoreconnect.apple.com/v1/apps/$APP/versions" \
                -d "{\"data\":{\"type\":\"appStoreVersions\",\"attributes\":{\"platform\":\"IOS\",\"versionString\":\"1.1\"}}}" > /tmp/nova.json
              head -c 400 /tmp/nova.json; echo ""
              NEWID=$(ruby -rjson -e 'd=JSON.parse(File.read("/tmp/nova.json")); puts d.dig("data","id") || ""')
            fi
            if [ -z "$NEWID" ]; then echo "ERRO: nao consegui criar a versao 1.1"; exit 1; fi
          fi
          echo "versao 1.1 ID: $NEWID"

          echo "=== 3. Copiando informacoes de revisao da 1.0 ==="
          if [ -n "$OLDID" ]; then
            api "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$OLDID/appReviewDetail" > /tmp/oldreview.json
            ruby -rjson -e '
              begin
                d=JSON.parse(File.read("/tmp/oldreview.json"))
                a=d.dig("data","attributes")||{}
                keep=a.slice("contactFirstName","contactLastName","contactEmail","contactPhone","demoAccountName","demoAccountPassword","demoAccountRequired","notes")
                File.write("/tmp/reviewbody.json", {data:{type:"appReviewDetails",attributes:keep,relationships:{appStoreVersion:{data:{type:"appStoreVersions",id:ENV["NEWID"]}}}}}.to_json)
                puts "review info copiada: " + keep.keys.join(",")
              rescue => e
                puts "sem review detail na 1.0: " + e.message
                File.write("/tmp/reviewbody.json","")
              end' 2>/dev/null || true
            export NEWID
            if [ -s /tmp/reviewbody.json ]; then
              api "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$NEWID/appReviewDetail" > /tmp/newreview.json
              NEWRD=$(ruby -rjson -e 'd=JSON.parse(File.read("/tmp/newreview.json")); puts d.dig("data","id") || ""')
              if [ -n "$NEWRD" ]; then
                api -X PATCH "https://api.appstoreconnect.apple.com/v1/appReviewDetails/$NEWRD" -d @/tmp/reviewbody.json | head -c 300; echo ""
              else
                api -X POST "https://api.appstoreconnect.apple.com/v1/appReviewDetails" -d @/tmp/reviewbody.json | head -c 300; echo ""
              fi
            fi
          fi

          echo "=== 4. Aguardando o build 1.1 processar (ate 40 min) ==="
          BUILDID=""
          for i in $(seq 1 40); do
            api "https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=$APP&limit=10" > /tmp/builds.json
            INFO=$(ruby -rjson -e 'd=JSON.parse(File.read("/tmp/builds.json")); b=(d["data"]||[]).find{|x| x.dig("attributes","version")=="1.1"}; puts b ? b["id"] + "|" + (b.dig("attributes","processed") ? "READY" : b.dig("attributes","processingState").to_s) : ""')
            BUILDID=$(echo "$INFO" | cut -d"|" -f1)
            STATE=$(echo "$INFO" | cut -d"|" -f2)
            echo "tentativa $i: build=${BUILDID:-nenhum} estado=$STATE"
            if [ -n "$BUILDID" ] && [ "$STATE" = "READY" ]; then break; fi
            sleep 60
          done
          if [ -z "$BUILDID" ]; then echo "ERRO: build 1.1 nao encontrado"; exit 1; fi
          if [ "$STATE" != "READY" ]; then echo "ERRO: build ainda processando apos 40 min"; exit 1; fi

          echo "=== 5. Vinculando build $BUILDID a versao 1.1 ==="
          api -X PATCH "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$NEWID" \
            -d "{\"data\":{\"type\":\"appStoreVersions\",\"id\":\"$NEWID\",\"relationships\":{\"build\":{\"data\":{\"type\":\"builds\",\"id\":\"$BUILDID\"}}}}}" | head -c 400; echo ""

          echo "=== 6. Submetendo para revisao ==="
          api -X POST "https://api.appstoreconnect.apple.com/v1/appSubmissions" \
            -d "{\"data\":{\"type\":\"appSubmissions\",\"relationships\":{\"appStoreVersion\":{\"data\":{\"type\":\"appStoreVersions\",\"id\":\"$NEWID\"}}}}}" > /tmp/sub.json
          head -c 500 /tmp/sub.json; echo ""
          echo "=== FEITO ==="
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}